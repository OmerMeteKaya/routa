[package]
name = "routa"
version = "0.1.0"
edition = "2021"

[features]
default = []
# Opt-in, Linux-only completion-based I/O backend, selected at compile
# time as a full alternative to the default mio/epoll backend -- see
# core::event_loop and core::conn module docs. Never enabled together
# with the default backend in the same binary.
io_uring = ["dep:io-uring"]

[dependencies]
mio = { version = "1", features = ["os-poll", "net"] }
rustls = "0.23"
rustls-pemfile = "2"
slab = "0.4"
socket2 = { version = "0.5", features = ["all"] }
webpki-roots = "0.26"
dashmap = "6"
memmap2 = "0.9"
lru = "0.12"
notify = "6"
arc-swap = "1"
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs", "use_pem"] }
subtle = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
sha1 = "0.10"
prometheus = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
signal-hook = "0.3"
libc = "0.2"
brotli = "6"
io-uring = { version = "0.7", optional = true }

[dev-dependencies]
rcgen = "0.14"

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"   # bilinçli: worker-failover panic=unwind'a dayanıyor, "abort" OLMAMALI

[lib]
name = "routa"
path = "src/lib.rs"

[[bin]]
name = "routa"
path = "src/main.rs"
