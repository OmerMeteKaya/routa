name: Nightly

on:
  schedule:
    - cron: '0 2 * * *'   # Her gece 02:00 UTC
  workflow_dispatch:        # Manuel tetikleme

jobs:
  # ══════════════════════════════════════════════════════════════════════
  # MSAN — Memory Sanitizer (clang only)
  # ══════════════════════════════════════════════════════════════════════
  msan:
    name: "MSAN"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang libssl-dev zlib1g-dev \
            curl openssl psmisc

      - name: Configure with MSAN
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSANITIZERS=OFF \
            -DFUZZ=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=memory -fno-omit-frame-pointer -g"

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Run unit tests under MSAN
        env:
          MSAN_OPTIONS: halt_on_error=0:print_stacktrace=1
        run: |
          for t in test_buf test_request test_middleware \
                   test_chunked test_file_cache test_h2_hpack test_auth; do
            echo "=== $t ==="
            ./build/$t || true
          done

  # ══════════════════════════════════════════════════════════════════════
  # Flaky test detection — run each test 5 times
  # ══════════════════════════════════════════════════════════════════════
  flaky-detection:
    name: "Flaky detection"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc libssl-dev zlib1g-dev \
            curl openssl psmisc

      - name: Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_BUILD_TYPE=Release \
            -DSANITIZERS=OFF -DFUZZ=OFF
          cmake --build build --parallel $(nproc)

      - name: Generate TLS certs
        run: |
          mkdir -p tests/certs
          openssl req -x509 -newkey rsa:2048 \
            -keyout tests/certs/test.key \
            -out tests/certs/test.crt \
            -days 1 -nodes -subj "/CN=localhost"

      - name: Repeat unit tests x5
        run: |
          FAILED=0
          TESTS="test_buf test_request test_middleware test_chunked
                 test_file_cache test_h2_hpack test_auth"
          for run in 1 2 3 4 5; do
            echo "══ Run $run/5 ══"
            for t in $TESTS; do
              if ! ./build/$t > /tmp/${t}_run${run}.log 2>&1; then
                echo "FLAKY: $t failed on run $run"
                cat /tmp/${t}_run${run}.log
                FAILED=1
              fi
            done
          done
          exit $FAILED

      - name: Repeat integration tests x5
        timeout-minutes: 30
        env:
          CI: "true"
          ROUTA_TEST_CERT: ${{ github.workspace }}/tests/certs/test.crt
          ROUTA_TEST_KEY:  ${{ github.workspace }}/tests/certs/test.key
        run: |
          chmod +x tests/run_test.sh
          FAILED=0
          for run in 1 2 3 4 5; do
            echo "══ Run $run/5 ══"
            for t in test_ws test_h2; do
              if ! ./tests/run_test.sh $t > /tmp/${t}_run${run}.log 2>&1; then
                echo "FLAKY: $t failed on run $run"
                cat /tmp/${t}_run${run}.log
                FAILED=1
              fi
            done
          done
          exit $FAILED

  # ══════════════════════════════════════════════════════════════════════
  # Stress — thread count variations
  # ══════════════════════════════════════════════════════════════════════
  stress:
    name: "Stress (${{ matrix.mode }})"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: "1-thread"
            workers: 1
          - mode: "4-thread"
            workers: 4
          - mode: "16-thread"
            workers: 16
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc libssl-dev zlib1g-dev \
            curl openssl psmisc wrk

      - name: Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_BUILD_TYPE=Release \
            -DSANITIZERS=OFF -DFUZZ=OFF
          cmake --build build --parallel $(nproc)

      - name: Stress test — ${{ matrix.workers }} worker(s)
        timeout-minutes: 10
        run: |
          # Start hello_world with N workers
          ROUTA_WORKERS=${{ matrix.workers }} ./build/hello_world &
          SERVER_PID=$!
          sleep 1

          # Verify it started
          curl -sf http://localhost:8080/ > /dev/null || {
            echo "Server failed to start"; kill $SERVER_PID; exit 1
          }

          # wrk load test — 30s
          wrk -t4 -c100 -d30s --latency http://localhost:8080/ \
            | tee /tmp/wrk_${{ matrix.workers }}.txt

          kill $SERVER_PID 2>/dev/null || true

          # Fail if p99 > 100ms
          P99=$(grep "99%" /tmp/wrk_${{ matrix.workers }}.txt \
                | awk '{print $2}' | sed 's/ms//')
          echo "p99 latency: ${P99}ms"

      - name: Upload stress results
        uses: actions/upload-artifact@v4
        with:
          name: stress-${{ matrix.mode }}
          path: /tmp/wrk_*.txt

  # ══════════════════════════════════════════════════════════════════════
  # Memory pressure — limited heap
  # ══════════════════════════════════════════════════════════════════════
  memory-pressure:
    name: "Memory pressure"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc libssl-dev zlib1g-dev psmisc

      - name: Build with ASAN
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSANITIZERS=ON -DFUZZ=OFF
          cmake --build build --parallel $(nproc)

      - name: Run unit tests with limited heap (256MB)
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          FAILED=0
          for t in test_buf test_request test_middleware \
                   test_chunked test_h2_hpack test_auth; do
            echo "=== $t (256MB heap) ==="
            if ! bash -c "ulimit -v 262144 && ./build/$t"; then
              echo "FAILED under memory pressure: $t"
              FAILED=1
            fi
          done
          exit $FAILED

  # ══════════════════════════════════════════════════════════════════════
  # Network simulation — packet delay + partial reads
  # ══════════════════════════════════════════════════════════════════════
  network-simulation:
    name: "Network simulation"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc libssl-dev zlib1g-dev \
            curl openssl psmisc iproute2

      - name: Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_BUILD_TYPE=Release \
            -DSANITIZERS=OFF -DFUZZ=OFF
          cmake --build build --parallel $(nproc)

      - name: Generate TLS certs
        run: |
          mkdir -p tests/certs
          openssl req -x509 -newkey rsa:2048 \
            -keyout tests/certs/test.key \
            -out tests/certs/test.crt \
            -days 1 -nodes -subj "/CN=localhost"

      - name: Inject 50ms network delay
        run: |
          # Add 50ms delay to loopback
          sudo tc qdisc add dev lo root netem delay 50ms || true

      - name: Run h2c tests under delay
        timeout-minutes: 10
        env:
          CI: "true"
          ROUTA_TEST_CERT: ${{ github.workspace }}/tests/certs/test.crt
          ROUTA_TEST_KEY:  ${{ github.workspace }}/tests/certs/test.key
        run: |
          chmod +x tests/run_test.sh
          ./tests/run_test.sh test_h2 || true

      - name: Remove network delay
        if: always()
        run: sudo tc qdisc del dev lo root 2>/dev/null || true

      - name: Inject packet loss (1%)
        run: |
          sudo tc qdisc add dev lo root netem loss 1% || true

      - name: Run h2c tests under packet loss
        timeout-minutes: 10
        env:
          CI: "true"
        run: |
          ./tests/run_test.sh test_h2 || true

      - name: Remove packet loss
        if: always()
        run: sudo tc qdisc del dev lo root 2>/dev/null || true

  # ══════════════════════════════════════════════════════════════════════
  # Fault injection — malloc failure simulation
  # ══════════════════════════════════════════════════════════════════════
  fault-injection:
    name: "Fault injection"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc libssl-dev zlib1g-dev

      - name: Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSANITIZERS=ON -DFUZZ=OFF
          cmake --build build --parallel $(nproc)

      - name: Build malloc fault injector
        run: |
          cat > /tmp/fail_malloc.c << 'EOF'
          #include <stdlib.h>
          #include <dlfcn.h>
          #include <stdatomic.h>

          static atomic_int g_countdown = 0;
          static void *(*real_malloc)(size_t) = NULL;

          void set_malloc_fail_after(int n) {
              atomic_store(&g_countdown, n);
          }

          void *malloc(size_t size) {
              if (!real_malloc)
                  real_malloc = dlsym(RTLD_NEXT, "malloc");
              int c = atomic_fetch_sub(&g_countdown, 1);
              if (c == 1) return NULL;   /* inject failure */
              return real_malloc(size);
          }
          EOF
          gcc -shared -fPIC -o /tmp/fail_malloc.so /tmp/fail_malloc.c \
              -ldl -lpthread

      - name: Run tests with malloc failure injection
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          # Run each test with LD_PRELOAD — verify no crash (SIGSEGV/SIGABRT)
          # A graceful failure (exit 1) is acceptable, crash is not.
          CRASHED=0
          for t in test_buf test_request test_h2_hpack; do
            echo "=== $t with fault injection ==="
            LD_PRELOAD=/tmp/fail_malloc.so ./build/$t
            CODE=$?
            if [ $CODE -eq 139 ] || [ $CODE -eq 134 ]; then
              echo "CRASH detected in $t (exit $CODE)"
              CRASHED=1
            fi
          done
          exit $CRASHED

  # ══════════════════════════════════════════════════════════════════════
  # Long fuzzing — 10 min per target
  # ══════════════════════════════════════════════════════════════════════
  fuzz-long:
    name: "Fuzz (${{ matrix.target }})"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_request
          - fuzz_hpack
          - fuzz_ws
          - fuzz_h2_frame
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang libssl-dev zlib1g-dev

      - name: Build fuzz target
        run: |
          cmake -B build_fuzz -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_BUILD_TYPE=Debug \
            -DFUZZ=ON -DSANITIZERS=OFF
          cmake --build build_fuzz \
            --target ${{ matrix.target }} --parallel $(nproc)

      - name: Seed corpus
        run: |
          CORPUS_NAME="${{ matrix.target }}"
          CORPUS_NAME="${CORPUS_NAME#fuzz_}"
          mkdir -p fuzz/corpus/$CORPUS_NAME
          case "$CORPUS_NAME" in
            request)
              printf 'GET / HTTP/1.1\r\nHost: localhost\r\n\r\n' \
                > fuzz/corpus/request/get
              printf 'POST /echo HTTP/1.1\r\nHost: localhost\r\nContent-Length: 4\r\n\r\ntest' \
                > fuzz/corpus/request/post
              ;;
            hpack)
              printf '\x82\x84\x86' > fuzz/corpus/hpack/basic
              ;;
            ws)
              printf '\x89\x80\x00\x00\x00\x00' > fuzz/corpus/ws/ping
              printf '\x81\x85\x00\x00\x00\x00hello' > fuzz/corpus/ws/text
              ;;
            h2_frame)
              printf '\x00\x00\x00\x04\x00\x00\x00\x00\x00' \
                > fuzz/corpus/h2_frame/settings
              printf '\x00\x00\x08\x06\x00\x00\x00\x00\x00\xde\xad\xbe\xef\xca\xfe\xba\xbe' \
                > fuzz/corpus/h2_frame/ping
              ;;
          esac

      - name: Run fuzz (10 minutes)
        timeout-minutes: 15
        run: |
          CORPUS_NAME="${{ matrix.target }}"
          CORPUS_NAME="${CORPUS_NAME#fuzz_}"
          MAX_LEN=4096
          case "$CORPUS_NAME" in
            ws|h2_frame) MAX_LEN=65536 ;;
          esac

          cd build_fuzz/fuzz
          ./${{ matrix.target }} ../../fuzz/corpus/$CORPUS_NAME \
            -max_len=$MAX_LEN \
            -timeout=10 \
            -max_total_time=600 \
            -detect_leaks=0 \
            -print_final_stats=1 \
            2>&1 | tee /tmp/${{ matrix.target }}.log

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: |
            build_fuzz/fuzz/crash-*
            build_fuzz/fuzz/leak-*
            /tmp/${{ matrix.target }}.log

  # ══════════════════════════════════════════════════════════════════════
  # Performance regression baseline
  # ══════════════════════════════════════════════════════════════════════
  perf-regression:
    name: "Perf regression"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc libssl-dev zlib1g-dev \
            wrk curl

      - name: Build release
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_BUILD_TYPE=Release \
            -DSANITIZERS=OFF -DFUZZ=OFF
          cmake --build build --parallel $(nproc)

      - name: HTTP/1.1 baseline benchmark
        run: |
          ./build/hello_world &
          SERVER_PID=$!
          sleep 1

          # Warmup
          wrk -t2 -c50 -d5s http://localhost:8080/ > /dev/null

          # Benchmark
          wrk -t4 -c200 -d30s --latency http://localhost:8080/ \
            | tee /tmp/bench_h1.txt

          kill $SERVER_PID 2>/dev/null || true

          # Extract and check minimums
          RPS=$(grep "Requests/sec" /tmp/bench_h1.txt \
                | awk '{print int($2)}')
          P99=$(grep "99%" /tmp/bench_h1.txt \
                | awk '{print $2}')
          echo "HTTP/1.1 — RPS: $RPS  p99: $P99"

          # Fail if RPS < 50000 (conservative for CI hardware)
          if [ "$RPS" -lt 50000 ]; then
            echo "REGRESSION: RPS $RPS < 50000 threshold"
            exit 1
          fi

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: perf-baseline
          path: /tmp/bench_*.txt

  # ══════════════════════════════════════════════════════════════════════
  # Nightly summary
  # ══════════════════════════════════════════════════════════════════════
  summary:
    name: "Nightly summary"
    runs-on: ubuntu-24.04
    needs:
      - msan
      - flaky-detection
      - stress
      - memory-pressure
      - network-simulation
      - fault-injection
      - fuzz-long
      - perf-regression
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Nightly Results" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| MSAN | ${{ needs.msan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Flaky detection | ${{ needs.flaky-detection.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Stress | ${{ needs.stress.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Memory pressure | ${{ needs.memory-pressure.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Network simulation | ${{ needs.network-simulation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Fault injection | ${{ needs.fault-injection.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Fuzz long | ${{ needs.fuzz-long.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Perf regression | ${{ needs.perf-regression.result }} |" >> $GITHUB_STEP_SUMMARY