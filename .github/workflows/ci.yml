name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  # ══════════════════════════════════════════════════════════════════════
  # Build + Test matrix
  # ══════════════════════════════════════════════════════════════════════
  build-and-test:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "gcc-debug-asan"
            os: ubuntu-24.04
            compiler: gcc
            build_type: Debug
            sanitizers: ON
          - label: "gcc-release"
            os: ubuntu-24.04
            compiler: gcc
            build_type: Release
            sanitizers: OFF
          - label: "clang-debug-asan"
            os: ubuntu-24.04
            compiler: clang
            build_type: Debug
            sanitizers: ON
          - label: "clang-release"
            os: ubuntu-24.04
            compiler: clang
            build_type: Release
            sanitizers: OFF
          - label: "macos-clang-release"
            os: macos-14
            compiler: clang
            build_type: Release
            sanitizers: OFF

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        timeout-minutes: 5
        run: |
          if [ "${{ matrix.os }}" = "macos-14" ]; then
            brew install cmake ninja openssl zlib coreutils
          else
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends \
              cmake ninja-build clang gcc \
              libssl-dev zlib1g-dev \
              curl openssl psmisc lsof \
              gcovr lcov
          fi

      - name: Configure
        run: |
          EXTRA=""
          if [ "${{ matrix.label }}" = "gcc-debug-asan" ]; then
            EXTRA="-DCOVERAGE=ON"
          fi
          if [ "${{ matrix.os }}" = "macos-14" ]; then
            OPENSSL_ROOT=$(brew --prefix openssl)
            EXTRA="$EXTRA -DOPENSSL_ROOT_DIR=$OPENSSL_ROOT"
          fi
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER=${{ matrix.compiler }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DSANITIZERS=${{ matrix.sanitizers }} \
            -DFUZZ=OFF \
            $EXTRA

      - name: Build
        run: cmake --build build --parallel $(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Generate TLS certs
        run: |
          mkdir -p tests/certs
          openssl req -x509 -newkey rsa:2048 \
            -keyout tests/certs/test.key \
            -out tests/certs/test.crt \
            -days 1 -nodes \
            -subj "/CN=localhost"

      - name: Run unit tests
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=0:print_stacktrace=1
        run: |
          TESTS="test_buf test_request test_middleware test_chunked
                 test_file_cache test_h2_hpack test_auth"
          FAILED=0
          for t in $TESTS; do
            echo "=== $t ==="
            if ! ./build/$t; then
              echo "FAILED: $t"
              FAILED=1
            fi
          done
          exit $FAILED

      - name: Run integration tests
        timeout-minutes: 5
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=0:print_stacktrace=1
          CI: "true"
          ROUTA_TEST_CERT: ${{ github.workspace }}/tests/certs/test.crt
          ROUTA_TEST_KEY:  ${{ github.workspace }}/tests/certs/test.key
        run: |
          chmod +x tests/run_test.sh
          FAILED=0

          if [ "${{ matrix.os }}" = "macos-14" ]; then
            ./build/test_ws &
            WS_PID=$!
            sleep 2
            nc -z 127.0.0.1 18765 && echo "PORT OPEN" || echo "PORT CLOSED"
            # Try actual WebSocket handshake
            curl -v --http1.1 \
              -H "Upgrade: websocket" \
              -H "Connection: Upgrade" \
              -H "Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==" \
              -H "Sec-WebSocket-Version: 13" \
              http://127.0.0.1:18765/ws 2>&1 | head -30 || true
            kill $WS_PID 2>/dev/null || true
            exit 0
          fi

          echo "=== test_ws ==="
          if ! ./tests/run_test.sh test_ws; then
            echo "FAILED: test_ws"; FAILED=1
          fi

          echo "=== test_h2 ==="
          if ! ./tests/run_test.sh test_h2; then
            echo "FAILED: test_h2"; FAILED=1
          fi

          exit $FAILED

      - name: Coverage report
        if: matrix.label == 'gcc-debug-asan'
        run: |
          gcovr \
            --root . \
            --exclude 'tests/.*' \
            --exclude 'fuzz/.*' \
            --exclude 'build/.*' \
            --xml build/coverage.xml \
            --html-details build/coverage.html \
            --print-summary \
            || true

      - name: Upload coverage
        if: matrix.label == 'gcc-debug-asan'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            build/coverage.xml
            build/coverage.html

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-${{ matrix.label }}
          path: |
            tests/certs/
            build/*.log
        # ══════════════════════════════════════════════════════════════════════
        # BSD platform tests — FreeBSD, OpenBSD, NetBSD
        # ══════════════════════════════════════════════════════════════════════
  bsd-platforms:
          name: "${{ matrix.name }}"
          runs-on: ubuntu-latest
          needs: build-and-test
          continue-on-error: ${{ matrix.allow_failure }}
          strategy:
            fail-fast: false
            matrix:
              include:
                - name: "freebsd-15-clang"
                  os: freebsd
                  os_version: "15.0"
                  compiler: clang
                  allow_failure: false
                - name: "freebsd-15-gcc"
                  os: freebsd
                  os_version: "15.0"
                  compiler: gcc
                  allow_failure: false
                - name: "openbsd-78-clang"
                  os: openbsd
                  os_version: "7.8"
                  compiler: clang
                  allow_failure: true
                - name: "netbsd-101-gcc"
                  os: netbsd
                  os_version: "10.1"
                  compiler: gcc
                  allow_failure: true

          steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Run on ${{ matrix.os }}
              uses: cross-platform-actions/action@v0.32.0
              env:
                ASAN_OPTIONS: detect_leaks=0
                CI: "true"
              with:
                operating_system: ${{ matrix.os }}
                version: ${{ matrix.os_version }}
                shell: bash
                run: |
                  set -e

                  # ── Package install ──────────────────────────────────────
                  case "${{ matrix.os }}" in
                    freebsd)
                      sudo pkg install -y cmake ninja openssl
                      NCPU=$(/sbin/sysctl -n hw.ncpu)
                      OPENSSL_DIR="/usr/local"
                      ;;
                    openbsd)
                      sudo pkg_add cmake ninja openssl zlib
                      NCPU=$(/sbin/sysctl -n hw.ncpu)
                      OPENSSL_DIR="/usr/local"
                      ;;
                    netbsd)
                      sudo pkgin -y install cmake ninja-build openssl zlib
                      NCPU=$(/sbin/sysctl -n hw.ncpu)
                      OPENSSL_DIR="/usr/pkg"
                      ;;
                  esac

                  # ── Compiler check ───────────────────────────────────────
                  # FreeBSD/OpenBSD: gcc is actually a clang wrapper or absent;
                  # fall back to clang if gcc not found
                  CC="${{ matrix.compiler }}"
                  if ! command -v "$CC" > /dev/null 2>&1; then
                    echo "WARNING: $CC not found, falling back to cc"
                    CC=cc
                  fi

                  # ── Configure ────────────────────────────────────────────
                  cmake -B build -G Ninja \
                    -DCMAKE_C_COMPILER="$CC" \
                    -DCMAKE_BUILD_TYPE=Release \
                    -DSANITIZERS=OFF \
                    -DFUZZ=OFF \
                    -DOPENSSL_ROOT_DIR="$OPENSSL_DIR"

                  # ── Build ────────────────────────────────────────────────
                  cmake --build build --parallel "$NCPU"

                  # ── TLS certs ────────────────────────────────────────────
                  mkdir -p tests/certs
                  case "${{ matrix.os }}" in
                    netbsd)
                     OPENSSL_CONF=/usr/pkg/etc/openssl/openssl.cnf \
                     openssl req -x509 -newkey rsa:2048 \ 
                      -keyout tests/certs/test.key \
                      -out tests/certs/test.crt \
                      -days 1 -nodes \
                      -subj "/CN=localhost"
                    ;;
                  *)
                    openssl req -x509 -newkey rsa:2048 \
                      -keyout tests/certs/test.key \
                      -out tests/certs/test.crt \
                      -days 1 -nodes \
                      -subj "/CN=localhost"
                    ;;
                  esac

                  # ── Unit tests ───────────────────────────────────────────
                  FAILED=0
                  for t in test_buf test_request test_middleware test_chunked \
                           test_file_cache test_h2_hpack test_auth; do
                    echo "=== $t ==="
                    if ! ./build/$t; then
                      echo "FAILED: $t"
                      FAILED=1
                    fi
                  done

                  # ── Integration tests ────────────────────────────────────
                  export ROUTA_TEST_CERT="$PWD/tests/certs/test.crt"
                  export ROUTA_TEST_KEY="$PWD/tests/certs/test.key"
                  chmod +x tests/run_test.sh
                  for t in test_ws test_h2; do
                    echo "=== $t ==="
                    if ! ./tests/run_test.sh "$t"; then
                      echo "FAILED: $t"
                      FAILED=1
                    fi
                  done

                  exit $FAILED

            - name: Upload artifacts on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                name: "failure-${{ matrix.name }}"
                path: tests/certs/
  # ══════════════════════════════════════════════════════════════════════
  # Fuzz smoke — 30s per target, every push
  # ══════════════════════════════════════════════════════════════════════
  fuzz-smoke:
    name: "Fuzz smoke"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang libssl-dev zlib1g-dev

      - name: Build fuzz targets
        run: |
          cmake -B build_fuzz -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_BUILD_TYPE=Debug \
            -DFUZZ=ON \
            -DSANITIZERS=OFF
          cmake --build build_fuzz --parallel $(nproc)

      - name: Seed corpus
        run: |
          mkdir -p fuzz/corpus/request fuzz/corpus/hpack \
                   fuzz/corpus/ws fuzz/corpus/h2_frame
          printf 'GET / HTTP/1.1\r\nHost: localhost\r\n\r\n' \
            > fuzz/corpus/request/get
          printf 'POST /echo HTTP/1.1\r\nHost: localhost\r\nContent-Length: 4\r\n\r\ntest' \
            > fuzz/corpus/request/post
          printf '\x82\x84\x86' > fuzz/corpus/hpack/basic
          printf '\x89\x80\x00\x00\x00\x00' > fuzz/corpus/ws/ping
          printf '\x00\x00\x00\x04\x00\x00\x00\x00\x00' \
            > fuzz/corpus/h2_frame/settings
          printf '\x00\x00\x08\x06\x00\x00\x00\x00\x00\xde\xad\xbe\xef\xca\xfe\xba\xbe' \
            > fuzz/corpus/h2_frame/ping

      - name: Run fuzz smoke
        run: |
          cd build_fuzz/fuzz
          FAILED=0
          for target in fuzz_request fuzz_hpack fuzz_ws fuzz_h2_frame; do
            echo "=== $target ==="
            MAX_LEN=4096
            [ "$target" = "fuzz_ws" ] || [ "$target" = "fuzz_h2_frame" ] \
              && MAX_LEN=65536
            if ! ./$target ../../fuzz/corpus/${target#fuzz_} \
                  -max_len=$MAX_LEN -timeout=5 -max_total_time=30 \
                  -detect_leaks=0 2>&1 | tail -3; then
              FAILED=1
            fi
          done
          exit $FAILED

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-ci
          path: build_fuzz/fuzz/crash-*

  # ══════════════════════════════════════════════════════════════════════
  # SAST — static analysis (cppcheck + clang-tidy), blocks on findings
  # ══════════════════════════════════════════════════════════════════════
  static-analysis:
    name: "SAST (cppcheck + clang-tidy)"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cppcheck clang-tidy cmake ninja-build \
            libssl-dev zlib1g-dev

      - name: Generate compile_commands.json
        run: |
          cmake -S . -B build \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_BUILD_TYPE=Debug \
            -DFUZZ=OFF -DSANITIZERS=OFF

      - name: cppcheck
        run: |
          cppcheck \
            --enable=warning,performance,portability \
            --error-exitcode=1 \
            --suppress=missingInclude \
            --suppress=missingIncludeSystem \
            --suppress=constVariablePointer \
            --suppress=constParameterPointer \
            --suppress=redundantCondition \
            --suppress=allocaCalled \
            --inline-suppr \
            -Iinclude \
            src/ \
            2>&1 | tee cppcheck.txt
          # Preserve exit code from cppcheck (tee swallows it)
          exit "${PIPESTATUS[0]}"

      - name: clang-tidy
        run: |
          SOURCES=$(find src -name '*.c' | sort)
          FAILED=0
          for f in $SOURCES; do
            clang-tidy -p build \
              --checks='-*,clang-analyzer-*,bugprone-*,cert-*,-bugprone-easily-swappable-parameters,-clang-analyzer-security.insecureAPI.DeprecatedOrUnsafeBufferHandling,-clang-analyzer-security.insecureAPI.strcpy,-bugprone-reserved-identifier,-cert-dcl37-c,-cert-dcl51-cpp' \
              --warnings-as-errors='*' \
              --header-filter='.*' \
              -extra-arg='-Iinclude' \
              "$f" 2>&1 | tee -a clang-tidy.txt
            RC=${PIPESTATUS[0]}
            [ $RC -ne 0 ] && FAILED=$RC
          done
          exit $FAILED

      - name: Upload SAST results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-results
          path: |
            cppcheck.txt
            clang-tidy.txt

  # ══════════════════════════════════════════════════════════════════════
  # Secret scanning — gitleaks, runs on every push and PR
  # ══════════════════════════════════════════════════════════════════════
  secret-scan:
    name: "Secret scanning (gitleaks)"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}