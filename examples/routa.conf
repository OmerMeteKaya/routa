# ═══════════════════════════════════════════════════════════════════════════
# routa.conf — full reference
#
# Every line the parser understands is documented here, with its default
# value and valid options. Lines are `key = value` unless noted otherwise.
# Comments start with '#' (inline comments after a value are also fine).
# Values may optionally be quoted with "".
#
# ── Value formats ──────────────────────────────────────────────────────
# Booleans:  0/1, true/false, yes/no, on/off (case-insensitive).
# Durations: a number with a MANDATORY unit: ms, s, m, h.
#            Examples: 500ms, 45s, 2m, 1h. A bare number ("45") is
#            rejected -- every duration needs an explicit unit.
# Sizes:     a number with a MANDATORY unit: B, KB, MB, GB (1024-based,
#            case-insensitive). Examples: 512B, 256KB, 64MB, 1GB.
# ${VAR}:    anywhere in a value, expands from the environment
#            (e.g. tls_cert = ${TLS_CERT}). Undefined vars expand to "".
# include:   `include glob-pattern` pulls in other files, parsed with
#            this exact same syntax (e.g. include conf.d/*.conf).
#
# This file is also loaded verbatim by tests/config.rs, which asserts
# every field below parses to exactly the value shown -- keep them in sync.
#
# ── Multi-server mode: [server NAME] blocks ─────────────────────────────
# NOTE: this section describes tooling (config_multi.c's parser,
# routa-orchestrate) that exists only in this project's earlier C
# implementation (see archive/) and has not been ported here -- routa's
# own config loader (core::config) has no [server ...] block support at
# all today. Kept here as a record of that design for a possible future
# port, not as documentation of current behavior. Every top-level key in
# the rest of THIS file is current, working single-server syntax.
# ═══════════════════════════════════════════════════════════════════════════

# ── Resource profile ────────────────────────────────────────────────────
# light | balanced | performance. Only supplies DEFAULT values for a
# curated set of resource-related settings (workers, cache sizes,
# connection limits, cpu/numa affinity, memory limits, compression level,
# keepalive timeout) -- any of those keys written explicitly anywhere else
# in this file always overrides the profile's value, regardless of
# ordering. balanced (the default if this key is omitted entirely)
# reproduces routa's original hardcoded defaults exactly. default: balanced
resource_profile = performance

# ── Server basics ────────────────────────────────────────────────────────
port                = 8443
# workers: overridden by resource_profile above (performance ->
# cpu_count * 2 workers) unless uncommented here.
# workers            = 12
backlog              = 256
max_request_size     = 2MB
shutdown_timeout_ms  = 15s

# ── TLS (frontend, i.e. clients connecting to routa) ───────────────────────
# tls_cert/tls_key commonly come from the environment in real deployments
# rather than being hardcoded paths -- ${VAR} expansion supports that:
#   tls_cert = ${TLS_CERT}
#   tls_key  = ${TLS_KEY}
# This reference file uses plain paths instead so it's self-contained and
# testable without requiring any environment setup.
tls_cert            = tests/certs/test.crt
tls_key             = tests/certs/test.key
# tls_session_timeout: parsed, but rustls's session ticketer uses a
# fixed internal lifetime that this value cannot override -- session
# ID-based resumption (a separate, working mechanism) is unaffected.
tls_session_timeout = 2h
tls_ocsp_response   = tests/certs/test.crt

# ── SNI: additional certificates selected by hostname at handshake time ───
# The top-level tls_cert/tls_key above remain the default, used when the
# client sends no SNI or an unmatched hostname.
[tls_cert app.example.com]
   cert = tests/certs/test.crt
   key  = tests/certs/test.key

[tls_cert *.api.example.com]
   cert = tests/certs/test.crt
   key  = tests/certs/test.key

# ── Logging ─────────────────────────────────────────────────────────────
log_level            = warn
log_file             = /tmp/routa_test.log

# ── Timeouts & connection limits ────────────────────────────────────────
# keepalive_timeout: overridden by resource_profile above (performance -> 60s) unless uncommented here.
# keepalive_timeout  = 45s
request_timeout      = 20s
# max_connections: overridden by resource_profile above (performance -> 100000) unless uncommented here.
# max_connections    = 50000

# ── In-memory response cache ────────────────────────────────────────────
# Parsed, but not yet implemented -- no runtime effect today (distinct
# from file_cache_* above, which is a real, working static-file
# metadata/content cache). Reserved for a future revision.
# cache_memory_mb: overridden by resource_profile above (performance -> 512MB) unless uncommented here.
# cache_memory_mb    = 256MB
cache_dir            = /tmp/routa_cache

# ── Static file serving ──────────────────────────────────────────────────
# Format: url_prefix -> doc_root. Repeatable, one per line.
static_dir           = / -> ./public
static_dir           = /assets -> ./public/assets

# ── Static file cache (stat/mtime-based, separate from cache_memory_mb) ──
file_cache_enabled   = true
# file_cache_entries: overridden by resource_profile above (performance -> 4096) unless uncommented here.
# file_cache_entries = 1024
file_cache_ttl       = 10s
file_cache_strategy  = stat_ttl

# file_cache_mode controls how the cache is shared across worker
# threads (routa's workers are pthreads in one process, not separate
# processes like nginx's workers):
#   local            - legacy behavior: each worker keeps a fully
#                       independent cache. Simplest, but
#                       file_cache_invalidate() only affects the
#                       calling worker, and N workers each redo their
#                       own stat()/open()/mmap() for the same file.
#   shared_metadata  - (default, recommended) path metadata (etag,
#                       mtime, size) is shared across all workers via a
#                       lock-protected table; invalidation is instantly
#                       visible everywhere. The mapped file content
#                       itself still lives per-worker (mmap()/munmap()
#                       churn is the real per-worker cost, not the
#                       mapped pages, which the kernel page cache
#                       already shares across workers).
#   shared_content   - reserved for future work, currently falls back
#                       to shared_metadata with a warning.
file_cache_mode           = shared_metadata

# file_cache_lock: only meaningful for shared_metadata mode.
#   global   - a single lock guards the whole eviction-order table.
#              Simpler, more contention under high concurrency.
#   sharded  - the eviction-order bookkeeping is split into
#              file_cache_shards independent locks (path hash decides
#              which shard), reducing contention. The table's total
#              size limit (file_cache_entries) still applies globally
#              regardless of shard count.
file_cache_lock           = sharded
file_cache_shards         = 16    # must be a power of 2; rounded up otherwise

# file_cache_eviction: which entry gets evicted when the cache is full.
#   lru       - evicts the least-recently-used entry. Good general default.
#   lfu       - evicts the least-frequently-used entry (frequency
#               decays periodically so long-idle-but-once-popular
#               entries don't become permanently unevictable). Better
#               than LRU when some files are consistently much hotter
#               than others regardless of recency.
#   ttl_only  - no active ordering, just relies on TTL expiry. Cheapest,
#               least smart.
file_cache_eviction       = lru

# Negative caching: cache "file not found" results too, so repeated
# requests for a missing path don't re-stat() the filesystem every
# time. 0 disables negative caching entirely.
file_cache_negative_ttl   = 0

# Files smaller than this are mmap'd and served from memory; larger
# files are served via sendfile() instead. Bytes.
file_cache_mmap_threshold = 65536

# Soft byte budget for cached content (0 = no byte-based limit, only
# file_cache_entries' count-based limit applies). Whichever limit a
# newly-cached entry would exceed first triggers eviction.
file_cache_max_memory_mb  = 0

# file_cache_watch: how the cache learns that a file changed on disk.
#   none      - relies purely on file_cache_strategy's TTL/stat
#               behavior above; a change is picked up on the next TTL
#               expiry or stat() check, not instantly.
#   inotify   - (Linux only) watches cached files for real filesystem
#               change events and invalidates immediately. In
#               file_cache_mode=local, every worker owns an independent
#               watch. In shared_metadata/shared_content mode, a single
#               worker owns the watch centrally and the resulting
#               invalidation is visible to every worker through the
#               shared metadata table.
file_cache_watch          = none

# ── HTTP/2 tuning ─────────────────────────────────────────────────────────
h2_enabled                          = true
h2_header_table_size                = 8192B
h2_huffman_encoding                  = true
h2_dynamic_table_update              = true
h2_initial_window_size               = 131072B
h2_max_frame_size                    = 32768B
h2_max_header_list_size              = 65536B
h2_max_concurrent_streams            = 64
h2_max_concurrent_streams_hard_cap   = 512
h2_stream_timeout_ms                 = 45s
h2_keepalive_timeout_ms              = 90s
h2_server_push_enabled                = false
# h2_c_upgrade_enabled: parsed, not yet enforced -- routa currently only
# ever selects HTTP/2 via ALPN over TLS; the HTTP/1.1 `Upgrade: h2c`
# path (plaintext HTTP/2) isn't implemented, so this has no runtime
# effect yet regardless of its value.
h2_c_upgrade_enabled                  = true
# h2_stream_lookup: hashmap gives O(1) average lookup regardless of
# concurrency; linear uses a fixed-capacity table sized to
# h2_max_concurrent_streams_hard_cap, scanned linearly -- cheaper in
# practice at low concurrency since there's no hashing cost.
h2_stream_lookup                     = hashmap

# ── WebSocket tuning ───────────────────────────────────────────────────────
ws_enabled                = true      # default: false
ws_max_connections        = 5000      # default: 10000
ws_idle_timeout_ms        = 2m        # 0 = no idle timeout. default: 0
ws_max_frame_size         = 8MB       # single frame. default: 16MB
ws_max_message_size       = 32MB      # fragmented total. default: 64MB
ws_ping_interval_ms       = 20s       # default: 30s
ws_ping_timeout_ms        = 8s        # default: 10s
ws_max_ping_misses        = 2         # default: 3
ws_read_buf_size          = 32KB      # default: 64KB
ws_write_buf_size         = 32KB      # default: 64KB
ws_write_queue_max        = 64        # backpressure limit. default: 128
ws_permessage_deflate     = true      # RFC 7692 compression. default: false
ws_compression_level      = 5         # zlib level 1-9. default: 6
ws_compression_threshold  = 256B      # only compress messages >= this. default: 512B
ws_require_masking        = true      # require client masking (RFC 6455). default: true

# ── System resources ────────────────────────────────────────────────────
# socket_recv_buf_size: overridden by resource_profile above (performance -> 256KB) unless uncommented here.
# socket_recv_buf_size = 256KB
# socket_send_buf_size: overridden by resource_profile above (performance -> 256KB) unless uncommented here.
# socket_send_buf_size = 256KB
# cpu_affinity_enabled: overridden by resource_profile above (performance -> true) unless uncommented here.
# cpu_affinity_enabled  = true
cpu_affinity_start_core  = 2

# Process-wide memory limits (0 = disabled). soft: reject new connections
# (existing ones unaffected) once RSS exceeds this, resume once back under
# it. hard: trigger a graceful shutdown (same as SIGTERM) once exceeded --
# expects a process supervisor (systemd, etc.) to restart routa.
# memory_soft_limit_mb: overridden by resource_profile above (performance -> disabled) unless uncommented here.
# memory_soft_limit_mb = 1GB
# memory_hard_limit_mb: overridden by resource_profile above (performance -> disabled) unless uncommented here.
# memory_hard_limit_mb = 2GB

# NUMA-aware worker placement, layered on top of cpu_affinity_enabled:
# fills one NUMA node's cores before spilling onto the next, rather
# than striping workers evenly across every node, so that adjacent
# workers' working sets tend to stay in the same node's local memory.
# Falls back silently to plain round-robin core assignment on a
# single-node machine or one with no NUMA topology exposed.
# numa_aware_enabled: overridden by resource_profile above (performance -> true) unless uncommented here.
# numa_aware_enabled = true

# ── Global IP-based ACL, applied to every request before any pool-specific
# ACL. action is "allow" or "deny", checked in order; acl_default is the
# fallback when nothing matches. ────────────────────────────────────────
acl_default = allow
acl_allow   = 10.0.0.0/8
acl_deny    = 192.168.100.5

# ── Global header manipulation, applied to every response ──────────────
# Security headers are NOT sent by default (matches nginx/most servers'
# behavior -- these are policy decisions for the operator to make, not
# something a server should silently impose). The set below is a
# reasonable baseline for a typical site; adjust CSP especially, since a
# wrong value can break your own frontend's JS/CSS/fonts.
global_response_header_add    = X-Powered-By: routa
global_response_header_add    = X-Frame-Options: DENY
global_response_header_add    = X-Content-Type-Options: nosniff
global_response_header_add    = Referrer-Policy: strict-origin-when-cross-origin
# HSTS only makes sense once TLS is enabled -- and only once you're sure
# every subdomain that needs to be reachable actually supports HTTPS,
# since browsers will refuse plain-HTTP for the max-age duration
# afterward. Uncomment once TLS is confirmed stable in production:
# global_response_header_add  = Strict-Transport-Security: max-age=31536000; includeSubDomains
global_response_header_remove = Server

# ── Access logging (mw_logger.c) ────────────────────────────────────────
logger_enabled = true

# ── Response compression (mw_compress.c) ────────────────────────────────
compress_enabled  = true
compress_min_size = 512B
# compress_level: overridden by resource_profile above (performance -> 9) unless uncommented here.
# compress_level  = 7

# ── CORS (mw_cors.c) ─────────────────────────────────────────────────────
cors_enabled = true
cors_origin  = https://example.com
cors_methods = GET,POST,OPTIONS
cors_headers = Content-Type,Authorization,X-Request-Id

# ── Basic Auth (mw_auth.c) ──────────────────────────────────────────────
auth_basic_enabled = true
auth_basic_realm   = "Restricted Area"
auth_basic_user    = admin:s3cret
auth_basic_user    = readonly:readonly_pw

# ── JWT Auth (mw_auth.c) ─────────────────────────────────────────────────
# Mutually exclusive with basic auth in the default chain; both are
# enabled here purely so this reference config exercises every key.
# auth_jwt_secret commonly comes from the environment in real deployments:
#   auth_jwt_secret = ${JWT_SECRET}
auth_jwt_enabled      = true
auth_jwt_secret       = supersecretjwtsigningkey
auth_jwt_pubkey_path  = tests/certs/test.crt
auth_jwt_verify_exp   = true
auth_jwt_issuer       = routa-issuer
auth_jwt_audience     = routa-clients

# ── Rate limiting (mw_ratelimit.c) ───────────────────────────────────────
rate_limit_enabled            = true
rate_limit_requests_per_second = 50
rate_limit_burst              = 100

# ── Metrics endpoint (mw_metrics.c) ──────────────────────────────────────
metrics_enabled = true
metrics_path    = /internal/metrics


# ═══════════════════════════════════════════════════════════════════════════
# Load-balancer pools
#
# Each [pool NAME] section is an independently configured reverse-proxy
# upstream pool, routed to its own path pattern (lb_route). A server can
# have as many pools as it needs -- each request is matched to exactly one
# pool by its path, and each pool only ever talks to its own upstreams.
#
# If you don't need multiple pools, you can skip the [pool NAME] header
# entirely and just write `upstream` / `lb_*` lines directly -- they'll
# apply to a single implicit pool routed to "/*" (everything).
#
# upstream HOST:PORT [weight=N] -- HOST may be:
#   - an IPv4 literal:              10.0.0.1:3000
#   - a bracketed IPv6 literal:     [::1]:3000
#   - a hostname (resolved lazily
#     at connect time via DNS):    api.internal:8443
# https:// prefix marks a TLS/H2 upstream (ALPN-negotiated).
# ═══════════════════════════════════════════════════════════════════════════

[pool api]
   lb_route = /api/*
   lb_algo  = weighted_rr

   upstream 10.0.0.1:3000 weight=1
   upstream https://10.0.0.2:3443 weight=2
   upstream https://api.internal:8443 weight=1

   lb_pool_max_per_node          = 128
   lb_pool_connect_timeout_ms    = 3s
   lb_pool_idle_timeout_s        = 90s
   lb_upstream_read_timeout_ms   = 20s
   lb_upstream_write_timeout_ms  = 25s

   lb_passive_fail_threshold     = 5
   lb_passive_recover_threshold  = 3
   # circuit-breaker half-open: how long this pool's DOWN nodes with no
   # active health check wait before the next request is let through as a
   # recovery trial. 0 disables half-open (such a node stays DOWN forever
   # once tripped, unless lb_hc_type is also set). default: 30s
   lb_half_open_retry_after_ms   = 10s

   # Success-rate outlier detection: separate from the passive
   # fail/recover-threshold circuit breaker above -- this compares each
   # node's success rate against its peers' (like Envoy's outlier
   # detection) rather than reacting only to a node's own consecutive
   # failures, so one node performing worse than the rest of the pool
   # gets ejected even if it never crosses lb_passive_fail_threshold.
   lb_outlier_detection_enabled     = true
   lb_outlier_interval_ms           = 10s
   lb_outlier_min_request_volume    = 50
   lb_outlier_min_hosts             = 3
   lb_outlier_stdev_factor          = 1.9
   lb_outlier_base_ejection_time_ms = 30s
   lb_outlier_max_ejection_time_ms  = 5m
   lb_outlier_max_ejection_percent  = 20

   lb_hc_type            = http
   lb_hc_path            = /healthz
   lb_hc_interval_ms      = 3s
   lb_hc_timeout_ms       = 1500ms
   lb_hc_threshold_up     = 3
   lb_hc_threshold_down   = 2

   lb_max_retries         = 2
   lb_retry_on_5xx        = true

   lb_consistent_hash_vnodes = 200

   lb_sticky_session_enabled = true
   lb_sticky_cookie_name     = routa_api_sticky

   # Pool-scoped header manipulation
   request_header_add     = X-Forwarded-Pool: api
   request_header_remove  = X-Internal-Debug
   response_header_add    = X-Pool: api
   response_header_remove = X-Backend-Internal

   # Pool-scoped ACL (checked in addition to the global ACL above)
   acl_default = deny
   acl_allow   = 172.16.0.0/12

[pool static-assets]
   lb_route = /static-proxy/*
   lb_algo  = consistent_hash
   upstream 10.0.0.3:4000 weight=1
   lb_consistent_hash_vnodes = 100
